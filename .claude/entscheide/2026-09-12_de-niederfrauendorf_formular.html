<!DOCTYPE html>
<html lang="de-CH">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Entscheidformular</title>
<style>
:root{
  --bg:#f4f4f2; --card:#fff; --ink:#1a1a18; --mute:#6b6b66; --line:#dcdcd6;
  --akz:#1f4e79; --krit:#a4262c; --hoch:#c2591a; --mittel:#8a6d1f; --gering:#5b6b5b;
  --ok:#2d6a4f;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);
  font:16px/1.55 "Segoe UI",-apple-system,system-ui,Arial,sans-serif}
header{position:sticky;top:0;z-index:10;background:var(--card);
  border-bottom:1px solid var(--line);padding:14px 20px}
.wrap{max-width:980px;margin:0 auto}
h1{font-size:20px;margin:0 0 2px}
.meta{color:var(--mute);font-size:13px}
.bar{height:6px;background:var(--line);border-radius:3px;margin:10px 0 8px;overflow:hidden}
.bar>i{display:block;height:100%;background:var(--ok);width:0;transition:width .2s}
.tools{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:8px}
button{font:inherit;font-size:13px;padding:7px 12px;border:1px solid var(--line);
  background:#fbfbfa;border-radius:5px;cursor:pointer}
button:hover{background:#f0f0ec}
button.primary{background:var(--akz);color:#fff;border-color:var(--akz)}
button.primary:hover{filter:brightness(1.12)}
select{font:inherit;font-size:13px;padding:6px;border:1px solid var(--line);border-radius:5px;background:#fff}
main{max-width:980px;margin:20px auto 120px;padding:0 20px}
.vor{background:#eef2f6;border:1px solid #d5e0ea;border-radius:6px;padding:12px 16px;margin-bottom:20px}
.vor h2{font-size:14px;margin:0 0 6px;text-transform:uppercase;letter-spacing:.04em;color:var(--akz)}
.vor ul{margin:0;padding-left:18px}
.q{background:var(--card);border:1px solid var(--line);border-left:4px solid var(--line);
  border-radius:6px;padding:16px 18px;margin-bottom:14px}
.q.offen{border-left-color:var(--krit)}
.q.fertig{border-left-color:var(--ok)}
.qh{display:flex;flex-wrap:wrap;gap:8px;align-items:baseline}
.id{font-family:ui-monospace,Consolas,monospace;font-size:12px;color:var(--mute)}
.qt{font-weight:600;flex:1;min-width:200px}
.tag{font-size:11px;padding:2px 7px;border-radius:10px;border:1px solid currentColor;white-space:nowrap}
.t-kritisch{color:var(--krit)}.t-hoch{color:var(--hoch)}
.t-mittel{color:var(--mittel)}.t-gering{color:var(--gering)}
.t-blocker{color:#fff;background:var(--krit);border-color:var(--krit)}
.t-auf{color:var(--mute)}
.ctx{margin:8px 0;color:#3a3a36;font-size:14.5px}
details{margin:8px 0;font-size:13.5px}
summary{cursor:pointer;color:var(--akz)}
.beleg{background:#fafaf8;border:1px solid var(--line);border-radius:5px;padding:8px 12px;margin-top:6px}
.beleg div{font-family:ui-monospace,Consolas,monospace;font-size:12.5px;padding:2px 0}
.opts{margin:10px 0 0}
label.opt{display:flex;gap:9px;align-items:flex-start;padding:6px 8px;border-radius:5px;cursor:pointer}
label.opt:hover{background:#f6f6f3}
label.opt.emp{background:#f0f5ef;border:1px solid #cfe0cd}
.emp-tag{font-size:11px;color:var(--ok);border:1px solid var(--ok);border-radius:10px;padding:1px 6px;margin-left:6px}
.begr{font-size:13px;color:var(--mute);margin:2px 0 10px 30px}
textarea,input[type=text],input[type=date]{width:100%;font:inherit;font-size:14px;padding:7px 9px;
  border:1px solid var(--line);border-radius:5px;background:#fff;margin-top:6px}
textarea{min-height:58px;resize:vertical}
.felder{margin-top:10px;border-top:1px dashed var(--line);padding-top:10px}
.flabel{font-size:12.5px;color:var(--mute);text-transform:uppercase;letter-spacing:.03em}
.row{display:flex;gap:10px;flex-wrap:wrap}
.row>div{flex:1;min-width:170px}
.hidden{display:none}
footer{position:fixed;bottom:0;left:0;right:0;background:var(--card);
  border-top:1px solid var(--line);padding:10px 20px}
.fw{max-width:980px;margin:0 auto;display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.status{font-size:13px;color:var(--mute);margin-left:auto}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:74px;background:var(--ink);
  color:#fff;padding:9px 16px;border-radius:5px;font-size:14px;opacity:0;transition:opacity .25s;
  pointer-events:none;z-index:20}
.toast.on{opacity:1}
@media print{header,footer,.tools{position:static}button{display:none}}
</style>
</head>
<body>

<script>
(function(){
"use strict";

const STD = [
  { id:"__zurueck",  label:"Zurückstellen – später entscheiden", std:true },
  { id:"__na",       label:"Nicht zutreffend – Frage entfällt", std:true },
  { id:"__unklar",   label:"Unklar – bitte Varianten vertiefen", std:true },
  { id:"__frei",     label:"Andere Antwort (Freitext)", std:true, freitext:true }
];
const RANG = { kritisch:0, hoch:1, mittel:2, gering:3 };
const AUFW = { klein:0, mittel:1, gross:2 };
const KEY  = "entscheid:" + DATEN.meta.id;

const fragen = DATEN.fragen.map(f => {
  const opts = (f.optionen||[]).slice();
  STD.forEach(s => { if(!opts.some(o=>o.id===s.id)) opts.push(Object.assign({},s)); });
  return Object.assign({}, f, { optionen: opts });
});

fragen.sort((a,b) =>
  (b.blocker?1:0)-(a.blocker?1:0) ||
  (RANG[a.schweregrad]??9)-(RANG[b.schweregrad]??9) ||
  (AUFW[a.aufwand]??9)-(AUFW[b.aufwand]??9) ||
  String(a.id).localeCompare(String(b.id))
);

let state = {};
try { const r = localStorage.getItem(KEY); if(r) state = JSON.parse(r); } catch(e){}

function emp(f){ const o = f.optionen.find(x=>x.empfehlung); return o ? o.id : null; }
fragen.forEach(f => {
  if(!state[f.id]) state[f.id] = { wahl: emp(f), freitext:"", bemerkung:"", wer:"", bis:"" };
});

function speichern(){
  try { localStorage.setItem(KEY, JSON.stringify(state)); } catch(e){}
  zeichnenStatus();
}

function sichtbar(f){
  if(!f.bedingung) return true;
  const b = f.bedingung, s = state[b.frage];
  if(!s) return false;
  const werte = Array.isArray(b.wert) ? b.wert : [b.wert];
  return werte.indexOf(s.wahl) !== -1;
}
function beantwortet(f){
  const s = state[f.id];
  if(!s || !s.wahl) return false;
  if(s.wahl === "__zurueck" || s.wahl === "__unklar") return false;
  if(s.wahl === "__frei" && !s.freitext.trim()) return false;
  return true;
}
function esc(t){ return String(t==null?"":t).replace(/[&<>"']/g,
  c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }

function bauen(){
  const m = DATEN.meta;
  document.title = m.titel;
  document.getElementById("h-titel").textContent = m.titel;
  document.getElementById("h-meta").textContent =
    [m.projekt, m.datum, m.kontext].filter(Boolean).join(" · ");

  if(m.vorentscheide && m.vorentscheide.length){
    document.getElementById("vorentscheide").classList.remove("hidden");
    document.getElementById("vor-liste").innerHTML =
      m.vorentscheide.map(v=>"<li>"+esc(v)+"</li>").join("");
  }

  const liste = document.getElementById("liste");
  liste.innerHTML = fragen.map(f => {
    const s = state[f.id];
    const tags = [];
    if(f.blocker) tags.push('<span class="tag t-blocker">Blocker</span>');
    if(f.schweregrad) tags.push('<span class="tag t-'+esc(f.schweregrad)+'">'+esc(f.schweregrad)+'</span>');
    if(f.aufwand) tags.push('<span class="tag t-auf">Aufwand '+esc(f.aufwand)+'</span>');

    if(!emp(f)) tags.push('<span class="tag t-hoch">keine Empfehlung hinterlegt</span>');

    const belege = (f.belege&&f.belege.length)
      ? '<details><summary>Fundstellen ('+f.belege.length+')</summary><div class="beleg">'
        + f.belege.map(b=>"<div>"+esc(b)+"</div>").join("") + '</div></details>'
      : '<div class="begr">Fundstelle: nicht belegbar</div>';

    const opts = f.optionen.map(o => {
      const sel = s.wahl===o.id ? " checked" : "";
      const cls = o.empfehlung ? " emp" : "";
      const tag = o.empfehlung
        ? '<span class="emp-tag">Empfehlung'+(o.konfidenz?" · Konfidenz "+esc(o.konfidenz):"")+'</span>' : "";
      const begr = o.begruendung ? '<div class="begr">'+esc(o.begruendung)+'</div>' : "";
      return '<label class="opt'+cls+'"><input type="radio" name="'+esc(f.id)+'" value="'+esc(o.id)+'"'+sel+'>'
        + '<span>'+esc(o.label)+tag+'</span></label>'+begr;
    }).join("");

    const freiCls = s.wahl==="__frei" ? "" : " hidden";
    const folge = f.folgeaktion
      ? '<div class="row"><div><div class="flabel">Verantwortlich</div>'
        + '<input type="text" data-feld="wer" data-id="'+esc(f.id)+'" value="'+esc(s.wer)+'"></div>'
        + '<div><div class="flabel">Termin</div>'
        + '<input type="date" data-feld="bis" data-id="'+esc(f.id)+'" value="'+esc(s.bis)+'"></div></div>'
      : "";

    return '<section class="q" id="q-'+esc(f.id)+'" data-id="'+esc(f.id)+'">'
      + '<div class="qh"><span class="id">'+esc(f.id)+'</span>'
      + '<span class="qt">'+esc(f.titel)+'</span>'+tags.join("")+'</div>'
      + (f.kontext ? '<div class="ctx">'+esc(f.kontext)+'</div>' : "")
      + belege
      + '<div class="opts">'+opts+'</div>'
      + '<div class="felder">'
      + '<div class="frei'+freiCls+'" data-frei="'+esc(f.id)+'"><div class="flabel">Freitextantwort</div>'
      + '<textarea data-feld="freitext" data-id="'+esc(f.id)+'">'+esc(s.freitext)+'</textarea></div>'
      + '<div class="flabel">Bemerkung</div>'
      + '<textarea data-feld="bemerkung" data-id="'+esc(f.id)+'" placeholder="Optional">'+esc(s.bemerkung)+'</textarea>'
      + folge + '</div></section>';
  }).join("");

  liste.addEventListener("change", ev => {
    const t = ev.target;
    if(t.type==="radio"){ state[t.name].wahl = t.value; speichern(); aktualisieren(); }
    else if(t.dataset && t.dataset.feld){ state[t.dataset.id][t.dataset.feld] = t.value; speichern(); aktualisieren(); }
  });
  liste.addEventListener("input", ev => {
    const t = ev.target;
    if(t.dataset && t.dataset.feld){ state[t.dataset.id][t.dataset.feld] = t.value; speichern(); }
  });
  aktualisieren();
}

function aktualisieren(){
  const filter = document.getElementById("f-filter").value;
  fragen.forEach(f => {
    const el = document.getElementById("q-"+f.id);
    if(!el) return;
    const sicht = sichtbar(f), fertig = beantwortet(f), s = state[f.id];
    el.classList.toggle("fertig", fertig);
    el.classList.toggle("offen", !fertig);
    const fr = el.querySelector('[data-frei]');
    if(fr) fr.classList.toggle("hidden", s.wahl!=="__frei");
    let zeig = sicht;
    if(zeig && filter==="offen") zeig = !fertig;
    if(zeig && filter==="blocker") zeig = !!f.blocker;
    if(zeig && filter==="abw") zeig = s.wahl !== emp(f);
    el.classList.toggle("hidden", !zeig);
  });
  zeichnenStatus();
}

function zeichnenStatus(){
  const rel = fragen.filter(sichtbar);
  const done = rel.filter(beantwortet).length;
  const blk = rel.filter(f=>f.blocker && !beantwortet(f)).length;
  document.getElementById("h-bar").style.width = rel.length ? (done/rel.length*100)+"%" : "0";
  document.getElementById("s-status").textContent =
    done+" von "+rel.length+" beantwortet" + (blk ? " · "+blk+" Blocker offen" : "") + " · lokal gespeichert";
}

function ergebnis(){
  const rel = fragen.filter(sichtbar);
  return {
    formular: DATEN.meta.id,
    titel: DATEN.meta.titel,
    projekt: DATEN.meta.projekt || "",
    erzeugt: new Date().toISOString(),
    offen: rel.filter(f=>!beantwortet(f)).map(f=>f.id),
    uebersprungen: fragen.filter(f=>!sichtbar(f)).map(f=>f.id),
    antworten: rel.map(f => {
      const s = state[f.id];
      const o = f.optionen.find(x=>x.id===s.wahl) || {};
      return {
        id: f.id,
        frage: f.titel,
        blocker: !!f.blocker,
        schweregrad: f.schweregrad || "",
        gewaehlt_id: s.wahl || "",
        gewaehlt: o.label || "",
        status: beantwortet(f) ? "beantwortet"
              : (s.wahl==="__zurueck" ? "zurueckgestellt"
              : (s.wahl==="__unklar" ? "unklar" : "offen")),
        abweichung_von_empfehlung: s.wahl !== emp(f),
        freitext: s.freitext.trim(),
        bemerkung: s.bemerkung.trim(),
        verantwortlich: s.wer.trim(),
        termin: s.bis
      };
    })
  };
}

function markdown(){
  const e = ergebnis();
  const z = ["# Entscheide "+e.formular, "", "Stand: "+e.erzeugt, ""];
  e.antworten.forEach(a => {
    let l = "- **"+a.id+"** → "+(a.gewaehlt||"offen");
    if(a.abweichung_von_empfehlung && a.status==="beantwortet") l += " (Abweichung von der Empfehlung)";
    if(a.freitext) l += " | Freitext: "+a.freitext.replace(/\n/g," ");
    if(a.bemerkung) l += " | Bemerkung: "+a.bemerkung.replace(/\n/g," ");
    if(a.verantwortlich || a.termin) l += " | Pendenz: "+[a.verantwortlich,a.termin].filter(Boolean).join(", ");
    z.push(l);
  });
  if(e.offen.length){ z.push("", "Offen geblieben: "+e.offen.join(", ")); }
  return z.join("\n");
}

function csv(){
  const sp = ["id","frage","status","gewaehlt","abweichung_von_empfehlung",
              "freitext","bemerkung","verantwortlich","termin"];
  const q = v => '"'+String(v==null?"":v).replace(/"/g,'""')+'"';
  const e = ergebnis();
  return "\uFEFF" + [sp.join(";")].concat(
    e.antworten.map(a => sp.map(k=>q(a[k])).join(";"))).join("\r\n");
}

function laden(text, name, typ){
  const b = new Blob([text], {type:typ+";charset=utf-8"});
  const u = URL.createObjectURL(b), a = document.createElement("a");
  a.href = u; a.download = name; document.body.appendChild(a); a.click();
  document.body.removeChild(a); setTimeout(()=>URL.revokeObjectURL(u), 1500);
}
function toast(t){
  const el = document.getElementById("toast");
  el.textContent = t; el.classList.add("on");
  setTimeout(()=>el.classList.remove("on"), 2200);
}
function warnung(){
  const e = ergebnis();
  if(!e.offen.length) return true;
  return confirm(e.offen.length+" Frage(n) sind noch offen: "+e.offen.join(", ")
    + "\n\nTrotzdem ausgeben? Offene Punkte werden nicht umgesetzt, sondern erneut vorgelegt.");
}

document.getElementById("b-json").onclick = () => {
  if(!warnung()) return;
  laden(JSON.stringify(ergebnis(), null, 2), DATEN.meta.id+"_antworten.json", "application/json");
  toast("JSON heruntergeladen – Datei nach .claude/entscheide/ legen");
};
document.getElementById("b-csv").onclick = () => {
  laden(csv(), DATEN.meta.id+"_antworten.csv", "text/csv");
  toast("CSV heruntergeladen");
};
document.getElementById("b-md").onclick = () => {
  if(!warnung()) return;
  const t = markdown();
  const fertig = () => toast("Markdown in der Zwischenablage");
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(t).then(fertig, ()=>fallback(t));
  } else fallback(t);
  function fallback(txt){
    const ta = document.createElement("textarea");
    ta.value = txt; ta.style.position="fixed"; ta.style.opacity="0";
    document.body.appendChild(ta); ta.select();
    try { document.execCommand("copy"); fertig(); }
    catch(e){ prompt("Kopieren mit Strg+C:", txt); }
    document.body.removeChild(ta);
  }
};
document.getElementById("b-emp").onclick = () => {
  fragen.forEach(f => { const e = emp(f); if(e) state[f.id].wahl = e; });
  speichern(); bauen(); toast("Alle Fragen auf Empfehlung gesetzt");
};
document.getElementById("b-reset").onclick = () => {
  if(!confirm("Alle Eingaben verwerfen?")) return;
  try { localStorage.removeItem(KEY); } catch(e){}
  state = {};
  fragen.forEach(f => state[f.id] = { wahl: emp(f), freitext:"", bemerkung:"", wer:"", bis:"" });
  speichern(); bauen(); toast("Zurückgesetzt");
};
document.getElementById("f-filter").onchange = aktualisieren;

bauen();
})();
</script>
</body>
</html>
