name: Supabase Keep-Alive

on:
  schedule:
    - cron: '0 6 * * 1,4'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Supabase-Leseabfrage
        run: |
          STATUS=$(curl -s -o response.json -w "%{http_code}" \
            "${{ secrets.SUPABASE_URL }}/rest/v1/keepalive?select=id&limit=1" \
            -H "apikey: ${{ secrets.SUPABASE_ANON_KEY }}" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_ANON_KEY }}")
          echo "HTTP-Status: $STATUS"
          if [ "$STATUS" -ne 200 ]; then
            echo "FEHLER: Supabase-Abfrage fehlgeschlagen (HTTP $STATUS)"
            cat response.json
            exit 1
          fi
          echo "Projekt aktiv – Leseabfrage erfolgreich."

      - name: Zeitstempel protokollieren
        run: |
          echo "$(date -u '+%Y-%m-%d %H:%M:%S UTC') – Keep-Alive erfolgreich" >> keepalive.log
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add keepalive.log
          git commit -m "Keep-Alive $(date -u '+%Y-%m-%d')" || echo "Keine Aenderung"
          git push
